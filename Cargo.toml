[package]
name = "SolNAS_client"
version = "0.1.0"
edition = "2024"

[build-dependencies]
winres = "0.1"

[dependencies]
#try to keep it short
eframe = "0.27"
egui = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls","multipart"] }
rfd = "0.14"
image = "0.24"
once_cell = "1.21.4"
tray-icon = "0.19"
winres = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
