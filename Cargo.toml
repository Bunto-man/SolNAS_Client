[package]
name = "SolNAS_client"
version = "0.1.0"
edition = "2024"

[build-dependencies]
winres = "0.1"

[dependencies]
eframe = {version = "0.27"}

egui = {version = "0.27", default-features = false}
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls","multipart"] }
rfd = {version = "0.14", default-features = false, features = ["gtk3"]}
image = {version ="0.24", default-features = false, features = ["png", "ico"]}
once_cell = {version = "1.21.4", default-features = false}
tray-icon = "0.19"
winres = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
